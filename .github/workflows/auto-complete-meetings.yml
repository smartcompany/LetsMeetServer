name: Auto Complete Meetings

on:
  schedule:
    # 매일 한국 시간 자정 (UTC 15:00 = KST 00:00)
    - cron: '0 15 * * *'
  workflow_dispatch: # 수동 실행도 가능하도록

jobs:
  complete-meetings:
    runs-on: ubuntu-latest
    steps:
      - name: Call Auto Complete API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          API_URL="https://lets-meet-server.vercel.app/api/meetings/auto-complete"
          
          # 디버깅: 시크릿이 설정되어 있는지 확인
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ Error: CRON_SECRET이 설정되지 않았습니다."
            echo "GitHub Secrets에 CRON_SECRET을 설정해주세요."
            exit 1
          else
            echo "✅ CRON_SECRET이 설정되어 있습니다. (길이: ${#CRON_SECRET}자)"
          fi
          
          echo "🔵 API URL: $API_URL"
          echo "🔵 Authorization 헤더 설정 완료"
          
          response=$(curl -X POST "$API_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -w "\n%{http_code}" \
            -s)
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          echo "HTTP Status: $http_code"
          echo "Response: $body"
          
          if [ "$http_code" -ne 200 ]; then
            echo "Error: API call failed with status $http_code"
            exit 1
          fi
          
          echo "✅ Successfully completed expired meetings"
